name: CI

on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Build
        run: npm run build
      - name: Check for common secret patterns
        shell: bash
        run: |
          if grep -RInE '(SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|sb_secret_[A-Za-z0-9_-]{20,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY|mnemonic|seed phrase)' src public index.html .env.example 2>/dev/null; then
            echo "Potential secret-like content found in public files."
            exit 1
          fi